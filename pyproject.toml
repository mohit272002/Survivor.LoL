# Optional: only needed if you prefer uv (Python 3.12+) over pip
[project]
name = "survivor-lol"
version = "0.1.0"
description = "Sync-watch SaaS: unique room codes, synchronized streaming + live POV sharing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.19",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "anyio>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
